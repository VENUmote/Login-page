
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #0f172a, #312e81, #6d28d9);
        }

        /* Animated background circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            animation: float 7s ease-in-out infinite;
        }

        .circle.one {
            width: 220px;
            height: 220px;
            background: linear-gradient(45deg, #06b6d4, #3b82f6);
            top: 8%;
            left: 10%;
        }

        .circle.two {
            width: 180px;
            height: 180px;
            background: linear-gradient(45deg, #f472b6, #a855f7);
            bottom: 8%;
            right: 10%;
            animation-delay: 2s;
        }

        .circle.three {
            width: 100px;
            height: 100px;
            background: #818cf8;
            bottom: 20%;
            left: 15%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(15deg);
            }
        }

        /* Login card */
        .login-box {
            position: relative;
            z-index: 1;
            width: 360px;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            color: white;
            animation: appear 0.8s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-box h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #ddd6fe;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #d1d5db;
        }

        .input-group input:focus {
            border-color: #a5b4fc;
            box-shadow: 0 0 12px rgba(165, 180, 252, 0.4);
            transform: scale(1.02);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #ddd6fe;
            cursor: pointer;
            font-size: 12px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin: 5px 0 24px;
        }

        .remember {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        a {
            color: #c4b5fd;
            text-decoration: none;
        }

        a:hover {
            color: white;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(167, 139, 250, 0.4);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .signup {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #e5e7eb;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #bbf7d0;
        }

        @media (max-width: 420px) {
            .login-box {
                width: calc(100% - 36px);
                padding: 32px 24px;
            }

            .circle.one {
                left: -100px;
            }

            .circle.two {
                right: -70px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <main class="login-box">
        <h1>Welcome Back!</h1>
        <p class="subtitle">Sign in to continue your journey</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >Show</button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>
                <a href="#" id="forgotLink">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Sign In
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="signup">
            Don't have an account?
            <a href="#" id="signupLink">Sign Up</a>
        </p>
    </main>

    <script>
        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginBtn = document.getElementById("loginBtn");

        togglePassword.addEventListener("click", function () {
            if (password.type === "password") {
                password.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                password.type = "password";
                togglePassword.textContent = "Show";
            }
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            loginBtn.textContent = "Signing In...";
            loginBtn.disabled = true;

            setTimeout(function () {
                message.textContent =
                    "UI demo only. Connect a backend to authenticate " + email + ".";

                loginBtn.textContent = "Sign In";
                loginBtn.disabled = false;
            }, 800);
        });

        document.getElementById("forgotLink").addEventListener(
            "click", function (event) {
                event.preventDefault();
                message.textContent =
                    "Connect a password-reset page to recover your account.";
            }
        );

        document.getElementById("signupLink").addEventListener(
            "click", function (event) {
                event.preventDefault();
                message.textContent =
                    "Connect your registration page to create an account.";
            }
        );
    </script>

</body>
</html>
